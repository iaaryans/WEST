name: WEST Signed APK Artifact
on:
  push:
    branches: [west-signed-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Set up Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          chmod +x gradlew
      - name: Configure signing
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE:-}" || -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo 'One or more required repository signing secrets are unavailable.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > release.keystore
      - name: Build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Verify signed release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          apk=''
          for candidate in "${apks[@]}"; do
            if [[ "$candidate" == *universal* ]]; then apk="$candidate"; break; fi
          done
          if [[ -z "$apk" && ${#apks[@]} -eq 1 ]]; then apk="${apks[0]}"; fi
          test -n "$apk"
          cp "$apk" dist/WEST-v0.5.8-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/WEST-v0.5.8-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/WEST-v0.5.8-release.apk > dist/APK_BADGING.txt
          grep -q "package: name='it.vfsfitvnm.vimusic'" dist/APK_BADGING.txt
          (cd dist && sha256sum WEST-v0.5.8-release.apk > SHA256SUMS.txt)
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WEST-Signed-Release
          path: dist/
          if-no-files-found: error
          retention-days: 14
