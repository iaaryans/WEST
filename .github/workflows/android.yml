name: WEST - Build and Verify APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - west-fix
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out WEST source
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          chmod +x gradlew

      - name: Run mandatory JVM regression tests
        run: ./gradlew --no-daemon --stacktrace -PwestPreview :app:testDebugUnitTest :innertube:test :kugou:test

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace -PwestPreview :app:lintDebug

      - name: Build WEST debug APK (CI verification)
        run: ./gradlew --no-daemon --stacktrace -PwestPreview :app:assembleDebug

      - name: Verify and package WEST debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort)
          if (( ${#apks[@]} == 0 )); then
            echo 'No newly compiled APK found' >&2
            exit 1
          fi
          apk=''
          for candidate in "${apks[@]}"; do
            if [[ "$candidate" == *universal* ]]; then
              apk="$candidate"
              break
            fi
          done
          if [[ -z "$apk" && ${#apks[@]} -eq 1 ]]; then
            apk="${apks[0]}"
          fi
          if [[ -z "$apk" ]]; then
            echo 'Multiple APKs generated, but no universal APK found.' >&2
            exit 1
          fi
          cp "$apk" dist/WEST-debug.apk
          unzip -tq dist/WEST-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose dist/WEST-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging dist/WEST-debug.apk > dist/APK_BADGING.txt
          grep -q "application-label:'WEST'" dist/APK_BADGING.txt || {
            echo 'The APK does not expose WEST as the application label.' >&2
            exit 1
          }
          size=$(stat -c%s dist/WEST-debug.apk)
          {
            echo "WEST build commit: $GITHUB_SHA"
            echo 'Build variant: westPreview debug (CI verification only)'
            echo 'Artifact: WEST-debug.apk'
            echo "APK size in bytes: $size"
            echo 'Required size: greater than 25000000 bytes (debug only)'
            echo 'JVM tests: passed (workflow gate)'
            echo 'Android lint: passed (workflow gate)'
            echo 'APK signature: verified'
          } > dist/BUILD_REPORT.txt
          if (( size <= 25000000 )); then
            echo "APK size requirement not met: $size bytes" | tee -a dist/BUILD_REPORT.txt >&2
            exit 1
          fi
          git archive --format=zip --output=dist/WEST-Full-Source.zip HEAD
          (cd dist && sha256sum WEST-debug.apk WEST-Full-Source.zip > SHA256SUMS.txt)

      - name: Upload final WEST build
        uses: actions/upload-artifact@v4
        with:
          name: WEST-Verified-Build
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WEST-Test-Diagnostics
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results*
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            dist/BUILD_REPORT.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out WEST source
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          chmod +x gradlew

      - name: Decode release keystore from secret
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE:-}" ]]; then
            echo "RELEASE_KEYSTORE secret is not set. Cannot build a signed release." >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > release.keystore
          echo "Keystore decoded: $(stat -c%s release.keystore) bytes"
          ls -la release.keystore

      - name: Build signed WEST release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Locate the signed release APK
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort)
          apk=''
          for candidate in "${apks[@]}"; do
            if [[ "$candidate" == *universal* ]]; then
              apk="$candidate"
              break
            fi
          done
          if [[ -z "$apk" && ${#apks[@]} -eq 1 ]]; then
            apk="${apks[0]}"
          fi
          if [[ -z "$apk" ]]; then
            echo 'No release APK found.' >&2
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          cp "$apk" "WEST-${tag}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "WEST-${tag}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "WEST-${tag}.apk" > "BADGING-${tag}.txt"
          size=$(stat -c%s "WEST-${tag}.apk")
          {
            echo "WEST ${tag} release APK"
            echo "Commit: $GITHUB_SHA"
            echo "Build variant: release (signed, R8 minified, resources shrunk)"
            echo "APK size in bytes: $size"
            echo "Built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Application ID: it.vfsfitvnm.vimusic"
          } > "RELEASE-${tag}.txt"
          (sha256sum "WEST-${tag}.apk" > "SHA256-${tag}.txt")
          echo "apk_path=$(pwd)/WEST-${tag}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.locate.outputs.tag }}
          name: WEST ${{ steps.locate.outputs.tag }}
          body: |
            # WEST ${{ steps.locate.outputs.tag }}

            Built automatically by GitHub Actions from tag `${{ steps.locate.outputs.tag }}`.

            ## Installation

            1. Download `WEST-${{ steps.locate.outputs.tag }}.apk` from the Assets section below.
            2. Check the file with `sha256sum` and compare with `SHA256-${{ steps.locate.outputs.tag }}.txt`.
            3. Open the APK on your device and allow installs from that source if Android asks.
            4. Launch WEST.

            ## In-app updates

            Once this build is installed, future WEST updates will be detected and offered directly inside the app (Settings → About → Check for updates). No need to re-download APKs from GitHub manually.

            ## Build information

            - **Commit:** ${{ github.sha }}
            - **Build variant:** release (signed, R8 minified, resources shrunk)
            - **APK size:** ${{ steps.locate.outputs.size }} bytes
            - **Application ID:** `it.vfsfitvnm.vimusic`
            - **License:** GPL-3.0

            WEST is an independent project, not affiliated with or endorsed by YouTube, YouTube Music, Google LLC or the ViMusic maintainers. All trademarks belong to their respective owners.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ steps.locate.outputs.apk_path }}
            SHA256-${{ steps.locate.outputs.tag }}.txt
            BADGING-${{ steps.locate.outputs.tag }}.txt
            RELEASE-${{ steps.locate.outputs.tag }}.txt
