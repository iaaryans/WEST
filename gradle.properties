org.gradle.jvmargs=-Xmx1400m -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
org.gradle.workers.max=1
org.gradle.vfs.watch=false
# Sandbox has ~4GB RAM and no swap: compile Kotlin inside the Gradle daemon
# instead of a second JVM, so peak usage stays under the container cap.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.enableR8.fullMode=true
android.suppressUnsupportedCompileSdk=34

# Constrained CI/sandbox builds: cap Kotlin compile daemon heap
kotlin.daemon.jvmargs=-Xmx1024m
